document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

@font-face {\n  font-family: 'Libre Baskerville';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7dc41c70-a55f-48c7-a680-96fd5aa6ffe9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"13d18c93-cc1c-4e62-9eb0-1582f8195184\"><\u002Fscript>\n\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: #eef1f5; }\n  a { color: #3E6191; }\n  a:hover { color: #1C4070; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:'Exo 2',sans-serif; color:#1C4070; padding:48px 32px 80px; display:flex; flex-direction:column; align-items:center;\">\n  <div style=\"width:100%; max-width:780px; display:flex; flex-direction:column; gap:30px;\">\n\n    <div>\n      <div style=\"font-family:'Exo 2',sans-serif; font-weight:400; letter-spacing:0.26em; text-transform:uppercase; font-size:11px; color:#7BADE0;\">Leggett Capital Partners<\u002Fdiv>\n      <h1 style=\"font-family:'Libre Baskerville',serif; font-weight:400; font-size:36px; line-height:1.2; margin:11px 0 9px; color:#1C4070;\">Email Signatures<\u002Fh1>\n      <p style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:15.5px; line-height:1.6; color:#4a5568; margin:0; max-width:570px;\">Find your name below, click Copy, and paste into Outlook. The logo is built into the copy, so there is nothing else to download.<\u002Fp>\n      <div style=\"height:2px; width:46px; background:#158A82; margin-top:18px;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff; border:1px solid #dde3ea; padding:24px 28px;\">\n      <div style=\"font-family:'Exo 2',sans-serif; font-weight:500; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:#158A82;\">How to install it<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:16px; margin-top:16px;\">\n        <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:22px; height:22px; background:#1C4070; color:#fff; font-family:'Exo 2',sans-serif; font-weight:500; font-size:12px; display:flex; align-items:center; justify-content:center;\">1<\u002Fdiv>\n          <div style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:14.5px; line-height:1.6; color:#4a5568;\">Click the <strong style=\"font-weight:500; color:#1C4070;\">Copy<\u002Fstrong> button on your signature below. It will say Copied.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:22px; height:22px; background:#1C4070; color:#fff; font-family:'Exo 2',sans-serif; font-weight:500; font-size:12px; display:flex; align-items:center; justify-content:center;\">2<\u002Fdiv>\n          <div style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:14.5px; line-height:1.6; color:#4a5568;\">Open Outlook’s signature settings:<br>\n            <span style=\"display:inline-block; padding-top:5px;\"><strong style=\"font-weight:500; color:#1C4070;\">Windows<\u002Fstrong> &nbsp;File → Options → Mail → Signatures → New<\u002Fspan><br>\n            <strong style=\"font-weight:500; color:#1C4070;\">Mac<\u002Fstrong> &nbsp;Outlook → Settings → Signatures → +<br>\n            <strong style=\"font-weight:500; color:#1C4070;\">Web<\u002Fstrong> &nbsp;Settings → Mail → Compose and reply\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:22px; height:22px; background:#1C4070; color:#fff; font-family:'Exo 2',sans-serif; font-weight:500; font-size:12px; display:flex; align-items:center; justify-content:center;\">3<\u002Fdiv>\n          <div style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:14.5px; line-height:1.6; color:#4a5568;\">Name it <strong style=\"font-weight:500; color:#1C4070;\">Leggett<\u002Fstrong> and paste with <strong style=\"font-weight:500; color:#1C4070;\">Ctrl+V<\u002Fstrong> (<strong style=\"font-weight:500; color:#1C4070;\">Cmd+V<\u002Fstrong> on Mac).<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:22px; height:22px; background:#1C4070; color:#fff; font-family:'Exo 2',sans-serif; font-weight:500; font-size:12px; display:flex; align-items:center; justify-content:center;\">4<\u002Fdiv>\n          <div style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:14.5px; line-height:1.6; color:#4a5568;\">Set it for both <strong style=\"font-weight:500; color:#1C4070;\">New messages<\u002Fstrong> and <strong style=\"font-weight:500; color:#1C4070;\">Replies/forwards<\u002Fstrong>, then save and send yourself a test.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:13.5px; line-height:1.6; color:#6b7688; margin-top:18px; padding-top:15px; border-top:1px solid #eef1f4;\">If Copy does not work in your browser, use <strong style=\"font-weight:500; color:#1C4070;\">Select<\u002Fstrong> instead, then press Ctrl+C or Cmd+C.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"9\">\n      <div data-sig-card=\"true\" style=\"background:#fff; border:1px solid #dde3ea;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 22px; border-bottom:1px solid #eef1f4;\">\n          <div>\n            <div style=\"font-family:'Libre Baskerville',serif; font-size:17.5px; color:#1C4070;\">{{ p.name }}<\u002Fdiv>\n            <div style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:12.5px; letter-spacing:0.12em; text-transform:uppercase; color:#5F81B2; margin-top:3px;\">{{ p.title }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex-shrink:0; display:flex; gap:10px; align-items:center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.select }}\" style=\"font-family:'Exo 2',sans-serif; font-weight:500; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:#1C4070; background:#fff; border:1px solid #7BADE0; padding:10px 16px; cursor:pointer; white-space:nowrap;\" style-hover=\"background:#f5f8fc;\">{{ p.selectLabel }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.copy }}\" style=\"font-family:'Exo 2',sans-serif; font-weight:500; font-size:12.5px; letter-spacing:0.14em; text-transform:uppercase; color:#fff; background:#1C4070; border:none; padding:11px 22px; cursor:pointer; white-space:nowrap;\" style-hover=\"background:#158A82;\" style-active=\"background:#0f2547;\">{{ p.label }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ p.needsInfo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff8e6; border-bottom:1px solid #f0e2bd; padding:11px 22px; font-family:'Exo 2',sans-serif; font-weight:300; font-size:13px; line-height:1.55; color:#7a6220;\">{{ p.needsInfo }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"padding:28px 22px; background:#fff;\">\n          <sc-raw-table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"470\" style=\"border-collapse:collapse; width:470px;\">\n            <sc-raw-tr><sc-raw-td style=\"padding-bottom:12px;\">\n              <img data-leggett-logo=\"true\" src=\"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7\" alt=\"Leggett Capital Partners\" style=\"width:155px; height:auto; display:block;\">\n            <\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"border-top:1px solid #7BADE0; padding-top:12px;\">\n              <div style=\"font-family:Georgia,'Times New Roman',serif; font-size:15.5px; color:#1C4070; line-height:1.3;\">{{ p.name }}<\u002Fdiv>\n              <div style=\"font-family:'Segoe UI',Arial,sans-serif; font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:#5F81B2; padding-top:3px;\">{{ p.title }}<\u002Fdiv>\n              <div style=\"font-family:'Segoe UI',Arial,sans-serif; font-size:13.3px; line-height:1.65; color:#4a5568; padding-top:9px;\">{{ p.contactA }}<br><sc-if value=\"{{ p.contactB }}\" hint-placeholder-val=\"{{ false }}\"><span>{{ p.contactB }}<br><\u002Fspan><\u002Fsc-if>1106 Witte Rd, Ste 100 &nbsp;·&nbsp; Houston, TX 77055<br><span style=\"color:#3E6191;\">leggettcapitalpartners.com<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding-top:12px;\">\n              <div style=\"font-family:'Segoe UI',Arial,sans-serif; font-size:9px; line-height:1.5; color:#6b7688; width:470px; text-align:justify;\">This e-mail contains confidential information or information belonging to Leggett Capital Partners and is intended solely for the addressees. The unauthorized disclosure, use, dissemination or copying (either whole or partial) of this e-mail, or any information it contains, is prohibited. E-mails are susceptible to alteration and their integrity cannot be guaranteed. Leggett Capital Partners shall not be liable for this e-mail if modified or falsified. If you are not the intended recipient of this e-mail, please delete it immediately from your system and notify the sender of the wrong delivery and the mail deletion.<\u002Fdiv>\n            <\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"border-left:3px solid #158A82; background:#fff; border-top:1px solid #dde3ea; border-right:1px solid #dde3ea; border-bottom:1px solid #dde3ea; padding:20px 24px;\">\n      <div style=\"font-family:'Libre Baskerville',serif; font-size:15.5px; color:#1C4070;\">If something looks off after pasting<\u002Fdiv>\n      <div style=\"font-family:'Exo 2',sans-serif; font-weight:300; font-size:13.5px; line-height:1.75; color:#4a5568; margin-top:9px;\">\n        <strong style=\"font-weight:500; color:#1C4070;\">Logo too big or too small?<\u002Fstrong> Right-click it in the signature editor, choose Picture, set the width to 155 px and leave height on auto.<br>\n        <strong style=\"font-weight:500; color:#1C4070;\">Fonts look different?<\u002Fstrong> That is expected. Outlook cannot load our brand fonts, so these use Georgia and Segoe UI, which every recipient already has installed.<br>\n        <strong style=\"font-weight:500; color:#1C4070;\">Logo missing entirely?<\u002Fstrong> Your email client blocked the image on paste. Copy again and paste into the signature box rather than into a draft email.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:1200}}\">\nconst DISCLOSURE = 'This e-mail contains confidential information or information belonging to Leggett Capital Partners and is intended solely for the addressees. The unauthorized disclosure, use, dissemination or copying (either whole or partial) of this e-mail, or any information it contains, is prohibited. E-mails are susceptible to alteration and their integrity cannot be guaranteed. Leggett Capital Partners shall not be liable for this e-mail if modified or falsified. If you are not the intended recipient of this e-mail, please delete it immediately from your system and notify the sender of the wrong delivery and the mail deletion.';\n\nconst OFFICE = '832.804.8301';\nconst NEED_PHONE = 'Direct phone number missing. Send it over and I will add it.';\n\nconst PEOPLE = [\n  { key:'john',    name:'John Leggett',          title:'Founder & Managing Partner', email:'jl@leggettcp.com',      direct:'713.858.9171', office:OFFICE },\n  { key:'brian',   name:'Brian Weinberg',        title:'Partner',                    email:'bw@leggettcp.com',      direct:'713.205.8900', office:OFFICE },\n  { key:'ashleytz',name:'Ashley Tucker Zatcoff', title:'Partner · COO',              email:'at@leggettcp.com',      direct:'713.443.6138', office:OFFICE },\n  { key:'jackson', name:'Jackson Darr',          title:'Private Equity Analyst',     email:'jackson@leggettcp.com', direct:'414.870.3277', office:OFFICE },\n  { key:'hiba',    name:'Hiba Alkhuzaie',        title:'Operations Coordinator',     email:'hiba@leggettcp.com',    direct:'832.812.4004', office:OFFICE },\n  { key:'seslee',  name:'Seslee Skrabanek',      title:'Senior Accountant',          email:'seslee@leggettcp.com',  direct:'713.489.4053', office:OFFICE },\n  { key:'andrew',  name:'Andrew Herrick',        title:'Senior Accountant',          email:'ah@leggettcp.com',      direct:'713.496.2757', office:OFFICE },\n  { key:'ashleyr', name:'Ashley Ramirez',        title:'Accountant',                 email:'ar@leggettcp.com',      office:OFFICE, needsInfo:NEED_PHONE },\n  { key:'rosie',   name:'Rosie Romero',          title:'Accountant',                 email:'rosie@leggettcp.com',   direct:'713.701.9314', cell:'832.609.7904', office:OFFICE },\n];\n\nclass Component extends DCLogic {\n  state = { copied: null, selectedFor: null };\n\n  componentDidMount() { this.applyLogo(); }\n  componentDidUpdate() { this.applyLogo(); }\n\n  applyLogo() {\n    const src = window.LEGGETT_LOGO;\n    if (!src) return;\n    document.querySelectorAll('img[data-leggett-logo]').forEach(el => {\n      if (el.src !== src) el.src = src;\n    });\n  }\n\n  // line 1 = email; line 2 = direct + office on one line\n  lineA(p) {\n    return p.email;\n  }\n  lineB(p) {\n    const parts = [];\n    if (p.direct) parts.push('(Direct) ' + p.direct);\n    if (p.cell) parts.push('(Cell) ' + p.cell);\n    if (p.office) parts.push('(Office) ' + p.office);\n    return parts.join('  ·  ');\n  }\n\n  sigHtml(p) {\n    const logo = window.LEGGETT_LOGO || '';\n    const mail = '<a href=\"mailto:' + p.email + '\" style=\"color:#4a5568;text-decoration:none;\">' + p.email + '<\u002Fa>';\n    const phones = [];\n    if (p.direct) phones.push('(Direct) ' + p.direct);\n    if (p.cell) phones.push('(Cell) ' + p.cell);\n    if (p.office) phones.push('(Office) ' + p.office);\n    let contact = mail;\n    if (phones.length) contact += '<br>' + phones.join(' &nbsp;&middot;&nbsp; ');\n    return '<table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"470\" style=\"border-collapse:collapse;width:470px;\">' +\n      '<tr><td style=\"padding-bottom:9pt;\">' +\n      '<img src=\"' + logo + '\" alt=\"Leggett Capital Partners\" width=\"155\" height=\"34\" style=\"width:155px;height:34px;display:block;border:0;\">' +\n      '<\u002Ftd><\u002Ftr>' +\n      '<tr><td style=\"border-top:1pt solid #7BADE0;padding-top:9pt;\">' +\n      '<div style=\"font-family:Georgia,\\'Times New Roman\\',serif;font-size:11.5pt;color:#1C4070;line-height:1.3;\">' + p.name + '<\u002Fdiv>' +\n      '<div style=\"font-family:\\'Segoe UI\\',Arial,sans-serif;font-size:8pt;letter-spacing:0.09em;text-transform:uppercase;color:#5F81B2;padding-top:2pt;\">' + p.title + '<\u002Fdiv>' +\n      '<div style=\"font-family:\\'Segoe UI\\',Arial,sans-serif;font-size:10pt;line-height:1.65;color:#4a5568;padding-top:7pt;\">' +\n      contact + '<br>' +\n      '1106 Witte Rd, Ste 100 &nbsp;&middot;&nbsp; Houston, TX 77055<br>' +\n      '<a href=\"https://leggettcapitalpartners.com\" style=\"color:#3E6191;text-decoration:none;\">leggettcapitalpartners.com<\u002Fa>' +\n      '<\u002Fdiv><\u002Ftd><\u002Ftr>' +\n      '<tr><td style=\"padding-top:9pt;\">' +\n      '<div style=\"font-family:\\'Segoe UI\\',Arial,sans-serif;font-size:7pt;line-height:1.5;color:#6b7688;width:470px;text-align:justify;\">' + DISCLOSURE + '<\u002Fdiv>' +\n      '<\u002Ftd><\u002Ftr><\u002Ftable>';\n  }\n\n  sigText(p) {\n    let s = p.name + '\\n' + p.title + '\\nLeggett Capital Partners\\n' + p.email;\n    const phones = [];\n    if (p.direct) phones.push('(Direct) ' + p.direct);\n    if (p.cell) phones.push('(Cell) ' + p.cell);\n    if (p.office) phones.push('(Office) ' + p.office);\n    if (phones.length) s += '\\n' + phones.join(' · ');\n    s += '\\n1106 Witte Rd, Ste 100 · Houston, TX 77055\\nleggettcapitalpartners.com\\n\\n' + DISCLOSURE;\n    return s;\n  }\n\n  async copy(p) {\n    const html = this.sigHtml(p);\n    let ok = false;\n    try {\n      if (navigator.clipboard && window.ClipboardItem) {\n        await navigator.clipboard.write([new window.ClipboardItem({\n          'text/html': new Blob([html], { type: 'text/html' }),\n          'text/plain': new Blob([this.sigText(p)], { type: 'text/plain' }),\n        })]);\n        ok = true;\n      }\n    } catch (e) { ok = false; }\n    if (!ok) ok = this.legacyCopy(html);\n    this.setState({ copied: ok ? p.key : 'fail:' + p.key });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ copied: null }), 2200);\n  }\n\n  legacyCopy(html) {\n    const host = document.createElement('div');\n    host.setAttribute('contenteditable', 'true');\n    host.style.cssText = 'position:fixed;left:-9999px;top:0;white-space:normal;';\n    host.innerHTML = html;\n    document.body.appendChild(host);\n    const range = document.createRange();\n    range.selectNodeContents(host);\n    const sel = window.getSelection();\n    sel.removeAllRanges();\n    sel.addRange(range);\n    let ok = false;\n    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }\n    sel.removeAllRanges();\n    document.body.removeChild(host);\n    return ok;\n  }\n\n  selectOne(p, ev) {\n    const card = ev && ev.currentTarget ? ev.currentTarget.closest('[data-sig-card]') : null;\n    const table = card ? card.querySelector('table') : null;\n    if (!table) return;\n    const range = document.createRange();\n    range.selectNode(table);\n    const sel = window.getSelection();\n    sel.removeAllRanges();\n    sel.addRange(range);\n    this.setState({ selectedFor: p.key });\n    clearTimeout(this._t2);\n    this._t2 = setTimeout(() => this.setState({ selectedFor: null }), 3000);\n  }\n\n  renderVals() {\n    const copied = this.state.copied;\n    const sel = this.state.selectedFor;\n    return {\n      people: PEOPLE.map(p => ({\n        name: p.name,\n        title: p.title,\n        needsInfo: p.needsInfo || false,\n        contactA: this.lineA(p),\n        contactB: this.lineB(p),\n        label: copied === p.key ? 'Copied' : (copied === 'fail:' + p.key ? 'Copy failed' : 'Copy'),\n        selectLabel: sel === p.key ? 'Selected — press Ctrl+C' : 'Select',\n        copy: () => this.copy(p),\n        select: (ev) => this.selectOne(p, ev),\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
